name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for blame and new-code detection

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          # Pinned and wheels-only: no version drifts in under us between runs,
          # and no sdist setup script runs during install.
          pip install --only-binary :all: -r requirements-dev.txt
          # The project itself has no runtime dependencies, so nothing is
          # resolved here — this only puts src/ on the path.
          pip install -e . --no-deps

      - name: Run tests with coverage
        run: pytest

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e  # v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
