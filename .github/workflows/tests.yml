name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    name: pytest & ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          # Pinned and wheels-only: no version drifts in under us between runs,
          # and no sdist setup script runs during install.
          pip install --only-binary :all: -r requirements-dev.txt
          # The project itself has no runtime dependencies, so nothing is
          # resolved here — this only puts src/ on the path.
          pip install -e . --no-deps

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest
