[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitcoin-seed-tools"
version = "0.1.1"
description = "Local command-line tools for working with BIP-39 seed phrases."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest~=9.0",
    "pytest-cov~=7.1",
    "pre-commit~=4.5",
    "ruff>=0.15.9",
]

[project.scripts]
seed-tools = "seed_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seed_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/seed_tools --cov-report=term-missing --cov-report=xml --cov-config=pyproject.toml"

[tool.coverage.run]
relative_files = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-length enforced by formatter, not linter
]
