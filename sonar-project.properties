sonar.projectKey=bitcoin-seed-tools
sonar.organization=janrothen

# The workflows and the manifest are in scope on purpose. The tools have no
# runtime dependencies, so CI's dev install is the only place a third-party
# package touches this project at all — leaving it unanalysed would make the
# security rating a statement about src/ alone.
sonar.sources=src,.github,pyproject.toml,requirements-dev.txt
sonar.tests=tests
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
